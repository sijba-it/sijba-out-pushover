name: Build and Push Image

on:
  push:
    branches: [main, stage]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run pyflakes + pytest (inside Dockerfile.test)
        run: docker build -f Dockerfile.test -t sijba-out-pushover-test:${{ github.run_id }} .

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: echo "tag=$(date +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          provenance: false
          push: true
          tags: |
            ghcr.io/sijba-it/sijba-out-pushover:${{ steps.vars.outputs.tag }}
            ghcr.io/sijba-it/sijba-out-pushover:latest
